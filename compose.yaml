# Development stack: `docker compose up`, then open http://localhost:5173
#
# The repository is bind-mounted, so code changes reload as with `bun run dev`, and `union.sqlite`
# at the repository root is the same database the host commands use.
# The worker reaches the host Docker daemon through its socket: agent containers (union-t*) run next
# to these ones, not inside them.
#
# Ticket previews are served by the `proxy` service (Traefik) at http://t<ticket>.union.localhost:8080, to
# this machine only (the port is published on 127.0.0.1).
#
# Overrides (shell or .env): UNION_UID / UNION_GID (default 1000, your host user), DOCKER_GID (group
# of /var/run/docker.sock: `stat -c %g /var/run/docker.sock`), UNION_WEB_PORT (default 5173),
# UNION_PREVIEW_PORT (default 8080), GITHUB_TOKEN (fallback for projects without their own token),
# UNION_SSH_DIR (default ~/.ssh: the worker fetches Union's own `origin` with it, read-only).
#
# web and worker restart when they exit: the sidebar's Update pulls `main`, then ends both containers
# (UNION_SUPERVISED tells them something starts them again).
name: union-next

x-app: &app
  build:
    context: docker
    dockerfile: dev.Dockerfile
  image: union-dev:local
  user: '${UNION_UID:-1000}:${UNION_GID:-1000}'
  working_dir: /app
  init: true
  volumes:
    - .:/app

services:
  # Installs workspace dependencies into the mounted repository, then exits.
  install:
    <<: *app
    command: ['bun', 'install', '--frozen-lockfile']
    restart: 'no'

  # Builds the image agent containers run from (union-agent:local), then exits.
  agent-image:
    build:
      context: docker
      dockerfile: agent.Dockerfile
    image: union-agent:local
    entrypoint: ['true']
    restart: 'no'

  web:
    <<: *app
    command: ['bun', 'run', 'dev:web']
    restart: unless-stopped
    environment:
      UNION_DEV_HOST: 0.0.0.0
      UNION_SUPERVISED: '1'
    ports:
      - '${UNION_WEB_PORT:-5173}:5173'
    depends_on:
      install:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['bun', 'run', 'dev:worker']
    restart: unless-stopped
    group_add:
      - '${DOCKER_GID:-1001}'
    environment:
      # The directory is mounted (not the file) so token refreshes on the host stay visible.
      UNION_CLAUDE_CREDENTIALS: /home/bun/.claude-host/.credentials.json
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The ready check asks the proxy over the stack's network; people use the published port.
      UNION_PREVIEW_PROXY: http://proxy:80
      UNION_PREVIEW_PORT: ${UNION_PREVIEW_PORT:-8080}
      # Request counts per preview, to stop the ones nobody visits (never published to the host).
      UNION_PREVIEW_METRICS: http://proxy:8082/metrics
      UNION_SUPERVISED: '1'
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.claude:/home/bun/.claude-host:ro
      # Union's own `origin` may be an SSH remote (host aliases from its config included). Only the
      # worker gets it, read-only; projects clone over HTTPS with their own credentials.
      - type: bind
        source: ${UNION_SSH_DIR:-${HOME}/.ssh}
        target: /home/bun/.ssh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      install:
        condition: service_completed_successfully
      agent-image:
        condition: service_completed_successfully

  # Serves ticket previews: each preview's exposed service is labelled with its host
  # (t<ticket>.union.localhost) and joins the `union-preview` network, where this proxy finds it.
  proxy:
    image: traefik:v3.6.2
    # Like web and worker: back after Docker or WSL restarts, or previews never answer.
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=union-preview
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
    ports:
      # This machine only: previews run unreviewed branches.
      - '127.0.0.1:${UNION_PREVIEW_PORT:-8080}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - preview

networks:
  preview:
    name: union-preview
