id: web-reads-github-only
valid:
  - |
    const { data } = await octokit.rest.pulls.get({ ...repo, pull_number: number });
  - |
    await octokit.paginate(octokit.rest.issues.listComments, { ...repo });
  - |
    await octokit.request('GET /repos/{owner}/{repo}/stacks', repo);
  - |
    await octokit.graphql(`query { viewer { login } }`);
  - |
    const CREATE_PROJECT = `
      mutation CreateProject($ownerId: ID!) { createProjectV2(input: {}) { projectV2 { id } } }`;
invalid:
  - |
    await octokit.rest.issues.createComment({ ...repo, issue_number: 1, body });
  - |
    await octokit.rest.pulls.merge({ ...repo, pull_number: 1 });
  - |
    await octokit.request('POST /repos/{owner}/{repo}/issues', repo);
  - |
    await octokit.graphql(`mutation { addProjectV2ItemById(input: $input) { item { id } } }`);
