id: web-reads-trackers-only
valid:
  - |
    const page = await notion.page(token, pageId);
  - |
    const item = await provider.item(secret, config, id);
  - |
    const comments = await notion.comments(token, pageId);
  - |
    await api.addComment(base, input, slice);
  - |
    const transitions = await jira.transitions(auth, key);
invalid:
  - |
    await notion.updatePage(token, pageId, properties);
  - |
    await notion.createPage(token, parent, draft);
  - |
    await notion.addComment(token, { pageId }, richText);
  - |
    await provider.createItem(secret, config, { title, markdown });
  - |
    await jira.transitionIssue(auth, key, transitionId);
  - |
    await jira.updateIssue(auth, key, { fields, update });
  - |
    await jira.addComment(auth, key, body);
