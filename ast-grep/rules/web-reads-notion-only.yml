id: web-reads-notion-only
language: TypeScript
severity: error
message: The web server only reads Notion and the other trackers; pages, comments and items are written in the worker.
note: AGENTS.md, Rules (Notion).
files:
  - apps/web/**
rule:
  any:
    - pattern: $NOTION.createPage($$$)
    - pattern: $NOTION.updatePage($$$)
    # Only on a Notion client: the review page's `api.addComment` adds a review comment.
    - pattern: $NOTION_API.addComment($$$)
    - pattern: $PROVIDER.createItem($$$)
constraints:
  NOTION_API:
    regex: '(?i)notion'
ignores:
  - '**/*.test.ts'
